<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamesite</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="/static/style.css">
  </head>
<body>
    

<div class="container">

<a href="{{ url_for('game_page') }}">
  <button>Play game</button>
</a>
</div>

<div class="boxes">
{% if items %}
    {% for item in items %}
    <div class="card">
        <div class="card-img">
            <img src="/static/images/SSDicon.png" alt="">
        </div>

        <div class="card-title">{{ item[1] }}</div> <!-- name -->

        <div class="card-subtitle">
            {{ loop.index }} in the pack.
        </div>

        <hr class="card-divider">

        <div class="card-footer">
            <div class="card-price">
                <span>kr</span> {{ "%.2f"|format(item[2]) }}
            </div>

            <button class="card-btn">
                <!-- SVG -->
            </button>
        </div>
    </div>
    {% endfor %}

{% else %}
    <p>No products available.</p>
{% endif %}


</div>



</body>
</html>
